<script data-lab-console>
(function () {
  var lines = [];
  var box = null;

  function ensure() {
    if (box && box.isConnected) return box;
    box = document.createElement('pre');
    box.style.cssText =
      'margin:0;padding:18px 20px;' +
      'font:13px/1.75 ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,Menlo,' +
      '"DejaVu Sans Mono","Segoe UI Symbol","Apple Symbols",monospace;' +
      'white-space:pre-wrap;word-break:break-word;color:#0b0f14;background:#f6f7f9;' +
      'border-bottom:1px solid #e2e6eb;min-height:34px';
    var host = document.body || document.documentElement;
    host.insertBefore(box, host.firstChild);
    return box;
  }

  function fmt(v) {
    var seen = [];
    function walk(x, d) {
      if (x === null) return 'null';
      var t = typeof x;
      if (t === 'string') return x;
      if (t === 'number' || t === 'boolean' || t === 'bigint') return String(x);
      if (t === 'undefined') return 'undefined';
      if (t === 'function') return 'f ' + (x.name || 'anonymous');
      if (x instanceof Error) return x.name + ': ' + x.message;
      if (d > 5) return '...';
      if (seen.indexOf(x) > -1) return '[Circular]';
      seen.push(x);
      if (Array.isArray(x)) {
        return '[' + x.map(function (i) { return walk(i, d + 1); }).join(', ') + ']';
      }
      return '{' + Object.keys(x).map(function (k) {
        return k + ': ' + walk(x[k], d + 1);
      }).join(', ') + '}';
    }
    return walk(v, 0);
  }

  ['log', 'info', 'warn', 'error'].forEach(function (kind) {
    var orig = console[kind] ? console[kind].bind(console) : function () {};
    console[kind] = function () {
      var args = Array.prototype.slice.call(arguments);
      lines.push(args.map(fmt).join(' '));
      try { ensure().textContent = lines.join('\n'); } catch (e) {}
      orig.apply(null, args);
    };
  });

  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!lines.length) {
        ensure().textContent = '(页面跑完了，但没有任何输出)';
      }
    }, 80);
  });
})();
</script>

    <script>
    var tree = new BinarySearchTree();
    tree.insert(11);
    tree.insert(7);
    tree.insert(15);
    tree.insert(5);
    tree.insert(3);
    tree.insert(9);
    tree.insert(8);
    tree.insert(10);
    tree.insert(13);
    tree.insert(12);
    tree.insert(14);
    tree.insert(20);
    tree.insert(18);
    tree.insert(25);


    tree.insert(6);
    console.log('********* in-order transverse ***********');

    function printNode(value) {
        console.log(value);
    }

    tree.inOrderTraverse(printNode);

    console.log('********* pre-order transverse ***********');
    tree.preOrderTraverse(printNode);

    console.log('********* post-order transverse ***********');
    tree.postOrderTraverse(printNode);

    console.log('********* max and min ***********');
    console.log(tree.max());
    console.log(tree.min());
    console.log(tree.search(1) ? 'key 1 found.' : 'key 1 not found.');
    console.log(tree.search(8) ? 'key 8 found.' : 'key 8 not found.');

    console.log('********* remove 6 ***********');
    tree.remove(6);
    tree.inOrderTraverse(printNode);

    console.log('********* remove 5 ***********');
    tree.remove(5);
    tree.inOrderTraverse(printNode);

    console.log('********* remove 15 ***********');
    tree.remove(15);
    tree.inOrderTraverse(printNode);

    console.log('********* raw data structure ***********');
    console.log(tree.getRoot());
    </script>
