<!DOCTYPE html>
<html>

<head lang="en">
    <meta charset="UTF-8">
    <title>toUpperCase和toLowerCase</title>
</head>

<body>
    <script>
    var str = "Never deter till tomorrow that which you can do today";

    var arr=str.split(" ");
    for (var i = 0; i < arr.length; i++) {
    	if(arr[i]=="tomorrow"){
    		var strNew=arr[i].toUpperCase();
    	}
    }
    console.log(arr);

    document.write(strNew);
    </script>
