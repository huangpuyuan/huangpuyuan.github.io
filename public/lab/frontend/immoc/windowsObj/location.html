.box1 {

}

.box2 {
    height: 600px;
    background: #666;
}

<body>
    <div class="box1" id="top"></div>
    <div class="box2"></div>
    <input type="button" id="btn" value="返回顶部">

    console.log(location);
    console.log(location.protocol);
    console.log(location.search);

    //location.relaod重载页面。

    	}
    </script>
